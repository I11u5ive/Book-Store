[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    migrations,
    backups
per-file-ignores =
    config/settings/__init__.py:F401,F403
    config/settings/development.py:F403,F405
    config/settings/production.py:F403,F405
    config/sqlite_settings.py:F403,F405
