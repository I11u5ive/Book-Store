services:
  web:
    build: .
    container_name: bookstore_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
      WAREHOUSE_API_URL: http://projectb-web:8000/api/stock/
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:?Add WAREHOUSE_SERVICE_TOKEN to .env}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/books/', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build: .
    container_name: bookstore_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: bookstore_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: bookstore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookstore_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  projectb-web:
    build:
      context: ./ProjectB
    container_name: projectb_web
    restart: unless-stopped
    environment: &projectb-environment
      SECRET_KEY: ${PROJECTB_SECRET_KEY:?Add PROJECTB_SECRET_KEY to .env}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,projectb-web,nginx
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: projectb-db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://projectb-redis:6379/0
      CELERY_BROKER_URL: redis://projectb-redis:6379/1
      CELERY_RESULT_BACKEND: redis://projectb-redis:6379/2
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:?Add WAREHOUSE_SERVICE_TOKEN to .env}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
    ports:
      - "8001:8000"
    volumes:
      - projectb_static_volume:/app/staticfiles
    depends_on:
      projectb-db:
        condition: service_healthy
      projectb-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  projectb-celery:
    build:
      context: ./ProjectB
    container_name: projectb_celery
    restart: unless-stopped
    environment: *projectb-environment
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      projectb-web:
        condition: service_healthy
      projectb-redis:
        condition: service_healthy

  projectb-celery-beat:
    build:
      context: ./ProjectB
    container_name: projectb_celery_beat
    restart: unless-stopped
    environment: *projectb-environment
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      projectb-web:
        condition: service_healthy
      projectb-redis:
        condition: service_healthy

  projectb-db:
    image: postgres:17
    container_name: projectb_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - projectb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  projectb-redis:
    image: redis:7-alpine
    container_name: projectb_redis
    restart: unless-stopped
    volumes:
      - projectb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: bookstore_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - projectb_static_volume:/usr/share/nginx/html/warehouse-static:ro
    depends_on:
      web:
        condition: service_healthy
      projectb-web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  projectb_postgres_data:
  projectb_redis_data:
  projectb_static_volume:
