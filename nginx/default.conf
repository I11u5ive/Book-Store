upstream bookstore_app {
    server web:8000;
}

upstream warehouse_app {
    server projectb-web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 7d;
    }

    location /warehouse-static/ {
        alias /usr/share/nginx/html/warehouse-static/;
        access_log off;
        expires 7d;
    }

    # ProjectB API is exposed under /warehouse/ through this reverse proxy.
    # The prefix is stripped before the request reaches the ProjectB container.
    location /warehouse/ {
        proxy_pass http://warehouse_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://bookstore_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
