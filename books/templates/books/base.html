<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Book Store
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'books/style.css' %}"
    >

</head>


<body>

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'books:list' %}"
        >
            BookStore
        </a>


        <div>

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Hello, {{ user.username }}!
                </span>

                <a
                        class="btn btn-outline-light me-2"
                        href="{% url 'shop_orders:cart_detail' %}"
                >
                    Cart
                </a>

            <form
                method="post"
                action="{% url 'users:logout' %}"
                class="d-inline"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-outline-light"
                >
                    Logout
                </button>
            </form>

            {% else %}

                <a
                    class="btn btn-outline-light me-2"
                    href="{% url 'users:login' %}"
                >
                    Login
                </a>

                <a
                    class="btn btn-light"
                    href="{% url 'users:register' %}"
                >
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<main class="container mt-4">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
