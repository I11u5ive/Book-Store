<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Book Store
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'books/style.css' %}"
    >

</head>


<body>

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'books:list' %}"
        >
            BookStore
        </a>

        <div>

            <a
                class="btn btn-outline-light"
                href="{% url 'books:create' %}"
            >
                Add Book
            </a>

        </div>

    </div>

</nav>


<main class="container mt-4">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
