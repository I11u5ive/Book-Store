{% extends "books/base.html" %}


{% block title %}
    Delete Book
{% endblock %}


{% block content %}

<h1>
    Delete Book?
</h1>


<p>
    Are you sure you want to delete
    "{{ object.title }}"?
</p>


<form method="post">

    {% csrf_token %}


    <button
        type="submit"
        class="btn btn-danger"
    >
        Yes, Delete
    </button>


    <a
        href="{% url 'books:detail' object.pk %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
