{% extends "books/base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="alert alert-success">

        <h2>Payment completed</h2>

        {% if order %}

            <p>
                Order #{{ order.id }}
            </p>

            <p>
                Total:
                {{ order.total_amount }}
            </p>

        {% endif %}

    </div>

    <a
        href="{% url 'books:list' %}"
        class="btn btn-primary"
    >
        Back to books
    </a>

</div>

{% endblock %}
