{% extends "books/base.html" %}


{% block title %}
    Register
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h1 class="mb-4">
            Create Account
        </h1>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-success"
            >
                Register
            </button>

        </form>


        <p class="mt-3">

            Already have an account?

            <a href="{% url 'users:login' %}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
