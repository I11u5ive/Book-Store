{% extends "books/base.html" %}


{% block title %}

    {% if object %}
        Edit Book
    {% else %}
        Add Book
    {% endif %}

{% endblock %}


{% block content %}

<h1 class="mb-4">

    {% if object %}
        Edit Book
    {% else %}
        Add Book
    {% endif %}

</h1>


<form method="post">

    {% csrf_token %}

    {{ form.as_p }}


    <button
        type="submit"
        class="btn btn-success"
    >
        Save
    </button>


    <a
        href="{% url 'books:list' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
