name: CI

on:
  push:
  pull_request:

jobs:
  docker-compose-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-bookstore-secret-key-for-tests-only
          DEBUG=True
          POSTGRES_DB=bookstore
          POSTGRES_USER=bookstore
          POSTGRES_PASSWORD=bookstore-test-password
          POSTGRES_HOST=db
          DATABASE_URL=postgresql://bookstore:bookstore-test-password@db:5432/bookstore
          ALLOWED_HOSTS=localhost,127.0.0.1,web,nginx,projectb-web
          PROJECTB_SECRET_KEY=ci-projectb-secret-key-for-tests-only
          WAREHOUSE_SERVICE_TOKEN=ci-warehouse-service-token-for-tests-only
          EOF

      - name: Build and start all services
        run: docker compose up -d --build

      - name: Check ProjectA
        run: docker compose exec -T web python manage.py check

      - name: Test ProjectA with coverage
        run: docker compose exec -T web pytest --cov=. --cov-report=term-missing --cov-fail-under=70 -q

      - name: Check ProjectB
        run: docker compose exec -T projectb-web python manage.py check

      - name: Test ProjectB API with coverage
        run: docker compose exec -T projectb-web pytest --cov=warehouse --cov=accounts --cov-report=term-missing --cov-fail-under=70 -q

      - name: Validate ProjectA OpenAPI
        run: docker compose exec -T web python manage.py spectacular --validate

      - name: Validate ProjectB OpenAPI
        run: docker compose exec -T projectb-web python manage.py spectacular --validate

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
